<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Przekierowanie - Kalkulator PH</title>
  
  <!-- Automatyczne przekierowanie po 10 sekundach -->
  <meta http-equiv="refresh" content="10; url=https://kalkulator-ph.web.app">
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: #01263f;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .loader {
      border: 4px solid rgba(255,255,255,0.1);
      border-left-color: #009dd8;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #009dd8;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #c4c4c4; }
  </style>
</head>
<body>

  <div class="loader"></div>
  <h1>Zmieniamy adres! 🚂</h1>
  <p>Kalkulator PH jest teraz dostępny pod nowym adresem.</p>
  <p>Zaraz zostaniesz przekierowany automatycznie...</p>
  
  <a href="https://kalkulator-ph.web.app">Kliknij tutaj, jeśli przekierowanie nie zadziała</a>

  <script>
    // Natychmiastowe przekierowanie skryptem
    setTimeout(function() {
      window.location.href = "https://kalkulator-ph.web.app";
    }, 10000);
  </script>

</body>
</html>
